server:
  port: 4000
  servlet:
    context-path: /api

spring:
  application:
    name: khaibaoyte-backend

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=KhaiBaoYTe;encrypt=true;trustServerCertificate=true
    username: sa
    password: Your_password123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: validate          # CSDL đã tạo bằng script SQL, KHÔNG để JPA tự sinh
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Ho_Chi_Minh

app:
  jwt:
    secret: ChangeThisSecretKeyForProd_AtLeast32Chars_KhaiBaoYTe2026
    expiration-minutes: 720       # 12 giờ
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
