<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cập nhật sức khoẻ</title>
  <link rel="stylesheet" href="/frontend/assets/css/base.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/assets/css/layout.css">
</head>
<body>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/utils.js"></script>
  <script src="/frontend/assets/js/mock-data.js"></script>
  <script src="/frontend/assets/js/layout.js"></script>
  <script>
    const { content } = Layout.mount({
      role:'citizen', active:'health',
      pageTitle:'Cập nhật tình trạng sức khoẻ',
      pageSub:'Cập nhật hằng ngày để cán bộ y tế theo dõi đúng tình hình.'
    });

    content.insertAdjacentHTML('beforeend', `
      <div class="grid" style="grid-template-columns:2fr 1fr;gap:18px">
        <form class="card" id="up-form">
          <div class="card-header"><h3 class="card-title">Phiếu cập nhật mới</h3></div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label">Phiếu khai báo liên quan<span class="req">*</span></label>
              <select class="form-control" required>
                <option>KB00002 - 19/05/2026 - Sốt, ho khan</option>
                <option>KB00001 - 18/05/2026 - Không triệu chứng</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Nhiệt độ (°C)<span class="req">*</span></label>
                <input class="form-control" type="number" step="0.1" min="34" max="42" required>
              </div>
              <div class="form-group">
                <label class="form-label">Thời gian đo</label>
                <input class="form-control" type="datetime-local">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Triệu chứng hiện tại</label>
              <textarea class="form-control"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Ghi chú</label>
              <textarea class="form-control"></textarea>
            </div>
            <div class="flex justify-end gap-2 mt-2">
              <button type="reset" class="btn btn-ghost">Làm lại</button>
              <button class="btn btn-primary">Lưu cập nhật</button>
            </div>
          </div>
        </form>

        <div class="card">
          <div class="card-header"><h3 class="card-title">Lịch sử cập nhật gần đây</h3></div>
          <div class="card-body">
            <ul style="display:flex;flex-direction:column;gap:14px">
              ${[
                {t:'19/05 14:00', n:'38.0°C', s:'Đã uống thuốc, sốt giảm', c:'warning'},
                {t:'19/05 09:30', n:'38.5°C', s:'Sốt, ho khan, đau họng',  c:'danger'},
                {t:'18/05 19:00', n:'37.2°C', s:'Hơi mệt mỏi',             c:'muted'},
              ].map(x => `
                <li style="padding:12px;border:1px solid var(--border);border-radius:var(--radius)">
                  <div class="flex justify-between mb-2">
                    <strong>${x.n}</strong>
                    <span class="text-xs text-muted">${x.t}</span>
                  </div>
                  <div class="text-sm text-muted">${x.s}</div>
                </li>`).join('')}
            </ul>
          </div>
        </div>
      </div>
    `);
    document.getElementById('up-form').addEventListener('submit', e => {
      e.preventDefault(); toast('Đã lưu cập nhật sức khoẻ','success');
    });
  </script>
</body>
</html>
