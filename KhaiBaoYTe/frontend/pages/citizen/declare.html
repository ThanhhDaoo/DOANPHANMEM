<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khai báo y tế</title>
  <link rel="stylesheet" href="/frontend/assets/css/base.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/assets/css/layout.css">
</head>
<body>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/utils.js"></script>
  <script src="/frontend/assets/js/layout.js"></script>
  <script>
    const { content } = Layout.mount({
      role:'citizen', active:'declare',
      pageTitle:'Khai báo y tế', pageSub:'Vui lòng điền đầy đủ và trung thực các thông tin bên dưới.'
    });

    content.insertAdjacentHTML('beforeend', `
      <div class="grid" style="grid-template-columns:2fr 1fr;gap:18px">
        <form class="card" id="kb-form">
          <div class="card-header"><h3 class="card-title">Thông tin khai báo</h3></div>
          <div class="card-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Nhiệt độ cơ thể (°C)<span class="req">*</span></label>
                <input class="form-control" type="number" step="0.1" min="34" max="42" name="nhietDo" required>
              </div>
              <div class="form-group">
                <label class="form-label">Thời gian đo</label>
                <input class="form-control" type="datetime-local" name="thoiGian">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Triệu chứng hiện tại</label>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:4px">
                ${['Sốt','Ho','Khó thở','Đau họng','Mất vị giác','Mệt mỏi','Đau đầu','Sổ mũi']
                  .map(s => `<label class="flex items-center gap-2 text-sm"><input type="checkbox" name="trieuChung" value="${s}"> ${s}</label>`).join('')}
              </div>
              <textarea class="form-control mt-2" name="ghiChu" placeholder="Mô tả thêm (nếu có)"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Lịch sử di chuyển 14 ngày qua</label>
              <textarea class="form-control" name="lichSuDC" placeholder="VD: 18/5 đi siêu thị Co.opmart, 19/5 đi làm tại công ty ABC..."></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Lịch sử tiếp xúc</label>
              <textarea class="form-control" name="lichSuTX" placeholder="Liệt kê người bạn đã tiếp xúc gần (nếu có)"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Tệp đính kèm</label>
              <input class="form-control" type="file" multiple>
              <span class="form-hint">Có thể đính kèm ảnh kết quả test, đơn thuốc... (nếu có)</span>
            </div>

            <div class="flex gap-2 justify-between mt-4">
              <a class="btn btn-outline" href="dashboard.html">← Quay lại</a>
              <div class="flex gap-2">
                <button type="reset" class="btn btn-ghost">Làm lại</button>
                <button type="submit" class="btn btn-primary">Gửi khai báo</button>
              </div>
            </div>
          </div>
        </form>

        <aside class="card card-pad">
          <h3>Lưu ý</h3>
          <ul class="text-muted text-sm mt-3" style="line-height:1.8;padding-left:18px">
            <li>Khai báo trung thực, chính xác.</li>
            <li>Nhiệt độ ≥ 38°C nên chọn thêm triệu chứng <em>Sốt</em>.</li>
            <li>Nếu có triệu chứng nghi ngờ, hãy <strong>gửi yêu cầu hỗ trợ</strong> để được tư vấn.</li>
            <li>Bạn có thể chỉnh sửa khai báo trong <strong>30 phút</strong> sau khi gửi.</li>
          </ul>
        </aside>
      </div>
    `);

    document.getElementById('kb-form').addEventListener('submit', e => {
      e.preventDefault();
      toast('Đã ghi nhận khai báo. Cảm ơn bạn!','success');
      setTimeout(() => window.location.href = 'history.html', 700);
    });
  </script>
</body>
</html>
