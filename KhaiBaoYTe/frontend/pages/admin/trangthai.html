<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý trạng thái sức khoẻ</title>
  <link rel="stylesheet" href="/frontend/assets/css/base.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/assets/css/layout.css">
</head>
<body>
  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/utils.js"></script>
  <script src="/frontend/assets/js/mock-data.js"></script>
  <script src="/frontend/assets/js/layout.js"></script>
  <script>
    const { content, headerActions } = Layout.mount({
      role:'admin', active:'trangthai',
      pageTitle:'Danh mục trạng thái sức khoẻ',
      pageSub:'Cấu hình các giá trị dùng cho theo dõi sức khoẻ người dân.'
    });
    headerActions.innerHTML = `<button class="btn btn-primary" id="btn-new">+ Thêm trạng thái</button>`;

    content.insertAdjacentHTML('beforeend', `
      <div class="card">
        <div class="card-header"><h3 class="card-title">Danh sách trạng thái</h3></div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table class="table">
            <thead><tr><th>Mã</th><th>Tên trạng thái</th><th>Ví dụ áp dụng</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    `);

    const desc = {
      'TT001':'Người dân khoẻ mạnh, không có triệu chứng.',
      'TT002':'Có triệu chứng đáng nghi, cần theo dõi tiếp.',
      'TT003':'Đã xác nhận mắc bệnh, đang điều trị.',
      'TT004':'Tiếp xúc gần ca bệnh, cần cách ly.',
      'TT005':'Đã hồi phục, kết thúc theo dõi.'
    };

    const rows = document.getElementById('rows');
    function render(){
      rows.innerHTML = MOCK.trangThaiSucKhoe.map(t => `
        <tr>
          <td><strong>${t.id}</strong></td>
          <td>${t.ten}</td>
          <td class="text-muted">${desc[t.id] || '-'}</td>
          <td class="actions">
            <button class="btn btn-ghost btn-sm" onclick="openEdit('${t.id}')" title="Sửa">✏️</button>
            <button class="btn btn-ghost btn-sm" style="color:var(--danger)" onclick="del('${t.id}')" title="Xoá">🗑</button>
          </td>
        </tr>`).join('');
    }
    function form(t){
      return `
        <div class="form-row">
          <div class="form-group"><label class="form-label">Mã<span class="req">*</span></label>
            <input class="form-control" value="${t?.id||''}" maxlength="5" ${t?'disabled':''} required></div>
          <div class="form-group"><label class="form-label">Tên trạng thái<span class="req">*</span></label>
            <input class="form-control" value="${t?.ten||''}" required></div>
        </div>
        <div class="form-group"><label class="form-label">Mô tả áp dụng</label>
          <textarea class="form-control"></textarea></div>`;
    }
    function openEdit(id){
      const t = MOCK.trangThaiSucKhoe.find(x => x.id === id);
      modal({ title:'Cập nhật - ' + t.id, body: form(t), okText:'Lưu',
        onOk:() => toast('Đã cập nhật','success') });
    }
    function del(id){
      if(!confirm('Xoá trạng thái ' + id + '?')) return;
      const i = MOCK.trangThaiSucKhoe.findIndex(x => x.id === id);
      MOCK.trangThaiSucKhoe.splice(i,1); render(); toast('Đã xoá','success');
    }
    window.openEdit = openEdit; window.del = del;

    document.getElementById('btn-new').addEventListener('click', () => {
      modal({ title:'Thêm trạng thái', body: form(), okText:'Tạo mới',
        onOk:() => toast('Đã thêm trạng thái','success') });
    });
    render();
  </script>
</body>
</html>
