<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đổi mật khẩu</title>
  <link rel="stylesheet" href="/frontend/assets/css/base.css">
  <link rel="stylesheet" href="/frontend/assets/css/components.css">
  <link rel="stylesheet" href="/frontend/assets/css/layout.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-side">
      <div style="font-size:42px;margin-bottom:12px">🔒</div>
      <h2>Đổi mật khẩu</h2>
      <p>Nên đổi mật khẩu định kỳ và chọn chuỗi đủ mạnh để bảo vệ tài khoản.</p>
    </div>
    <div class="auth-form">
      <div class="box">
        <h1>Đổi mật khẩu</h1>
        <p class="sub">Nhập mật khẩu hiện tại và mật khẩu mới.</p>

        <form id="cp-form">
          <div class="form-group"><label class="form-label">Mật khẩu hiện tại<span class="req">*</span></label>
            <input class="form-control" type="password" name="cur" required></div>
          <div class="form-group"><label class="form-label">Mật khẩu mới<span class="req">*</span></label>
            <input class="form-control" type="password" name="nw" minlength="6" required>
            <span class="form-hint">Tối thiểu 6 ký tự.</span></div>
          <div class="form-group"><label class="form-label">Xác nhận mật khẩu mới<span class="req">*</span></label>
            <input class="form-control" type="password" name="cf" minlength="6" required></div>

          <button class="btn btn-primary btn-block btn-lg">Cập nhật</button>
          <p class="text-center text-sm mt-3">
            <a href="javascript:history.back()" class="text-muted">← Quay lại</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="/frontend/assets/js/auth.js"></script>
  <script src="/frontend/assets/js/utils.js"></script>
  <script>
    document.getElementById('cp-form').addEventListener('submit', e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      if(fd.get('nw') !== fd.get('cf')){ toast('Xác nhận mật khẩu không khớp','error'); return; }
      toast('Đổi mật khẩu thành công','success');
    });
  </script>
</body>
</html>
